<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR受付（オフライン対応）</title>

<style>
body { font-family:sans-serif; padding:10px; text-align:center; background:#f7f7f7; }
.card { background:#fff; padding:12px; margin:10px 0; border-radius:12px; }
video { width:100%; max-width:420px; border-radius:10px; }
#result { font-size:36px; margin:10px; font-weight:bold; padding:10px; border-radius:10px; }
.ok { background:#e7f8eb; color:#0b6b2a; }
.ng { background:#fdeaea; color:#a11a1a; }
.used { background:#fff3cd; color:#8a5a00; }
button { width:100%; padding:14px; margin-top:8px; font-size:18px; border-radius:10px; border:none; }
.primary { background:#111; color:#fff; }
.secondary { background:#ddd; }
.small { font-size:13px; color:#666; margin-top:6px; }
</style>

</head>

<body>

<div class="card">
<h2>QR受付（オフライン対応）</h2>

<video id="video" autoplay playsinline muted></video>

<button class="primary" onclick="startCamera()">カメラ開始</button>
<button class="secondary" onclick="stopCamera()">停止</button>

<div id="result">待機中</div>
<div id="detail" class="small"></div>
</div>

<div class="card">
<button class="primary" onclick="loadMaster()">最新チケットを保存</button>
<div class="small">保存済み: <span id="count">0</span></div>
</div>

<div class="card">
<button class="primary" onclick="syncUsed()">USEDを同期</button>
<div class="small">未同期: <span id="unsynced">0</span></div>
</div>

<script>
const GAS_URL = 'ここにあなたのApps ScriptのURL';

let master = {};
let used = JSON.parse(localStorage.getItem('used') || '{}');

function updateCounts(){
  document.getElementById('count').textContent = Object.keys(master).length;
  document.getElementById('unsynced').textContent =
    Object.values(used).filter(x=>!x.synced).length;
}

function setResult(cls, text, detail=''){
  const r = document.getElementById('result');
  r.className = cls;
  r.textContent = text;
  document.getElementById('detail').textContent = detail;
}

function saveUsed(){
  localStorage.setItem('used', JSON.stringify(used));
  updateCounts();
}

function decodeQR(qr){
  try{
    let s = qr.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4) s+='=';
    return JSON.parse(atob(s));
  }catch(e){ return null; }
}

async function loadMaster(){
  setResult('', '取得中...');
  const res = await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'loadMaster'})
  });
  const data = await res.json();
  master = data.result.tickets || {};
  localStorage.setItem('master', JSON.stringify(master));
  updateCounts();
  setResult('ok','保存完了');
}

function loadLocal(){
  master = JSON.parse(localStorage.getItem('master') || '{}');
  updateCounts();
}

async function syncUsed(){
  const list = Object.values(used).filter(x=>!x.synced);
  if(list.length===0){
    setResult('', '同期なし');
    return;
  }

  const res = await fetch(GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({
      action:'sync',
      usedEntries:list
    })
  });

  const data = await res.json();

  (data.result.results||[]).forEach(r=>{
    if(r.ok && used[r.tid]) used[r.tid].synced=true;
  });

  saveUsed();
  setResult('ok','同期完了');
}

let stream, timer;

async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment'}
    });
    video.srcObject = stream;

    const detector = new BarcodeDetector({formats:['qr_code']});

    timer = setInterval(async()=>{
      const codes = await detector.detect(video);
      if(codes.length>0){
        handleQR(codes[0].rawValue);
      }
    },700);

  }catch(e){
    setResult('ng','カメラエラー',e.message);
  }
}

function stopCamera(){
  if(timer) clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
}

function handleQR(raw){
  const data = decodeQR(raw);
  if(!data){ setResult('ng','NG','形式不正'); return; }

  const tid = data.tid;

  if(used[tid]){
    setResult('used','受付済み');
    return;
  }

  const m = master[tid];
  if(!m){
    setResult('ng','NG','一覧にない');
    return;
  }

  if(m.status==='USED'){
    setResult('used','受付済み');
    return;
  }

  used[tid] = {
    tid:tid,
    usedAt:new Date().toISOString(),
    synced:false
  };
  saveUsed();

  setResult('ok','OK', m.buyer+' 様');
}

loadLocal();
</script>

</body>
</html>
